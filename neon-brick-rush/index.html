<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101a37"><title>Neon Brick Rush</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1126;color:#fff;font-family:system-ui,Tahoma;overflow:hidden;touch-action:none}#app{height:100dvh;display:flex;align-items:center;justify-content:center}#shell{position:relative;width:min(100vw,56.25dvh);height:min(100dvh,177.777vw);background:linear-gradient(160deg,#273e79,#121d3d 45%,#0c142b);overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}#top{position:absolute;top:2%;left:5%;right:5%;display:flex;justify-content:space-between;align-items:center;pointer-events:none}#top strong{font-size:22px}#top small{color:#b5c8ef}#top button{pointer-events:auto;background:#344c8a;border:1px solid #7f9cdb;border-radius:14px;color:white;padding:9px 13px}#bottom{position:absolute;bottom:2%;left:4%;right:4%;display:flex;justify-content:space-around;gap:8px}button{cursor:pointer;font:inherit}#bottom button{background:linear-gradient(#405da2,#253d7a);border:1px solid #7599e6;border-radius:14px;color:white;padding:10px 8px;font-weight:700;flex:1}#overlay{position:absolute;inset:0;background:#0a1229d9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;text-align:center;padding:24px;z-index:3}#overlay h1{margin:0;color:#6ff5ff;text-shadow:0 0 22px #15c9ff;font-size:32px}#overlay p{line-height:1.8;color:#d4e6ff}#overlay button{padding:14px 30px;background:#00b8dd;border:0;border-radius:14px;color:#06152b;font-weight:900;font-size:20px}#overlay[hidden]{display:none}#toast{position:absolute;top:13%;width:100%;text-align:center;color:#ffec77;font-weight:900;font-size:20px;text-shadow:0 0 12px #ffc200;pointer-events:none}</style></head><body><div id="app"><div id="shell"><canvas id="game" width="450" height="800"></canvas><div id="top"><div><small>أفضل نتيجة</small><br><strong id="best">0</strong></div><div style="text-align:center"><small>المرحلة</small><br><strong id="level">1</strong></div><button id="pause">⏸ إيقاف</button></div><div id="toast"></div><div id="bottom"><button id="undo">↶ تراجع (1)</button><button id="speed">⚡ تسريع ×1</button><button id="restart">↻ إعادة</button></div><div id="overlay"><h1>NEON BRICK RUSH</h1><p>اسحب بإصبعك لتحديد اتجاه إطلاق الكرات.<br>حطّم المكعبات قبل وصولها إلى الأسفل.<br>اجمع الكرات الإضافية وفجّر القنابل!</p><button id="play">ابدأ اللعب</button></div></div></div><script>
(()=>{'use strict';const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),W=450,H=800,cols=7,cell=62,offsetX=8,topY=160,bottomY=692,launcherY=715;const $=id=>document.getElementById(id);let bricks=[],pickups=[],balls=[],particles=[],level=1,best=+(localStorage.nbrBest||0),total=1,shooting=false,aiming=false,angle=-Math.PI/2,paused=false,gameOver=false,speed=1,undoUsed=false,snapshot=null,score=0,returnX=225,firstReturn=null,launchTime=0,launched=0,finished=0,toastUntil=0,toastText='',last=0; $('best').textContent=best;
function rand(a,b){return a+Math.random()*(b-a)}function notice(s){toastText=s;toastUntil=performance.now()+1200}function reset(){bricks=[];pickups=[];balls=[];particles=[];level=1;total=1;score=0;shooting=false;paused=false;gameOver=false;speed=1;undoUsed=false;returnX=225;spawn();updateUI();$('overlay').hidden=true;$('speed').textContent='⚡ تسريع ×1'}function updateUI(){$('level').textContent=level;$('best').textContent=best;$('undo').textContent='↶ تراجع '+(undoUsed?'(0)':'(1)')}
function spawn(){for(const b of bricks)b.r++;for(const p of pickups)p.r++;const occupied=new Set();let count=Math.min(2+Math.floor(level/3),5);for(let i=0;i<count;i++){let c=Math.floor(rand(0,cols)),tries=0;while(occupied.has(c)&&tries++<20)c=Math.floor(rand(0,cols));if(occupied.has(c))continue;occupied.add(c);let type=level>=3&&Math.random()<.16?'bomb':level>=5&&Math.random()<.13?'armor':'normal';bricks.push({c,r:0,hp:Math.max(1,Math.round(level*1.9+rand(0,level*2+2)))*(type==='armor'?2:1),type,flash:0})}let c=Math.floor(rand(0,cols));if(!occupied.has(c)||Math.random()<.5)pickups.push({c,r:0,type:'ball'});if(level%4===0)pickups.push({c:Math.floor(rand(0,cols)),r:1,type:'laser'});if(bricks.some(b=>topY+b.r*cell+cell>bottomY-10)){endGame()}}
function endGame(){gameOver=true;shooting=false;$('overlay').hidden=false;$('overlay').innerHTML='<h1>انتهت اللعبة</h1><p>وصلت للمرحلة '+level+'<br>النتيجة: '+score+'</p><button id="play">العب مجددًا</button>';$('play').onclick=reset}
function fire(){if(shooting||paused||gameOver)return;snapshot=JSON.stringify({bricks,pickups,total,level,score,returnX});shooting=true;balls=[];launched=0;finished=0;firstReturn=null;launchTime=0;aiming=false;notice('انطلاق!')}
function createBall(){const vx=Math.cos(angle)*8,vy=Math.sin(angle)*8;balls.push({x:returnX,y:launcherY,vx,vy,done:false,trail:[]});launched++}
function hit(b){b.hp--;b.flash=1;score++;for(let i=0;i<4;i++)particles.push({x:offsetX+b.c*cell+31,y:topY+b.r*cell+31,vx:rand(-3,3),vy:rand(-3,3),life:20,color:b.type==='bomb'?'#ff9c55':'#66e8ff'});if(b.hp<=0){if(b.type==='bomb'){for(const other of bricks){if(other!==b&&Math.abs(other.c-b.c)<=1&&Math.abs(other.r-b.r)<=1)other.hp-=Math.max(3,level*2)}notice('💥 انفجار متسلسل')}bricks=bricks.filter(x=>x.hp>0)}}
function physics(){if(!shooting||paused)return;launchTime++;if(launched<total&&launchTime%7===1)createBall();for(const ball of balls){if(ball.done)continue;let steps=3;for(let s=0;s<steps;s++){ball.x+=ball.vx/steps;ball.y+=ball.vy/steps;if(ball.x<9){ball.x=9;ball.vx=Math.abs(ball.vx)}if(ball.x>W-9){ball.x=W-9;ball.vx=-Math.abs(ball.vx)}if(ball.y<topY+7){ball.y=topY+7;ball.vy=Math.abs(ball.vy)}if(ball.y>=launcherY){ball.done=true;finished++;if(firstReturn===null)firstReturn=Math.max(12,Math.min(W-12,ball.x));break}let collided=false;for(const b of bricks){const x=offsetX+b.c*cell,y=topY+b.r*cell;if(ball.x+6>x&&ball.x-6<x+cell-2&&ball.y+6>y&&ball.y-6<y+cell-2){const dl=Math.abs(ball.x+6-x),dr=Math.abs(x+cell-2-(ball.x-6)),dt=Math.abs(ball.y+6-y),db=Math.abs(y+cell-2-(ball.y-6));const m=Math.min(dl,dr,dt,db);if(m===dl||m===dr)ball.vx*=-1;else ball.vy*=-1;ball.x+=ball.vx/steps;ball.y+=ball.vy/steps;hit(b);collided=true;break}}if(collided)break;for(const p of [...pickups]){const px=offsetX+p.c*cell+31,py=topY+p.r*cell+31;if(Math.hypot(ball.x-px,ball.y-py)<19){pickups.splice(pickups.indexOf(p),1);if(p.type==='ball'){total++;notice('كرة إضافية +1')}else{for(const b of bricks)if(b.r===p.r)b.hp-=Math.max(2,level);bricks=bricks.filter(b=>b.hp>0);notice('⚡ ضربة ليزر')}}}}ball.trail.push([ball.x,ball.y]);if(ball.trail.length>5)ball.trail.shift()}if(launched===total&&finished>=total){shooting=false;returnX=firstReturn??returnX;level++;if(score>best){best=score;localStorage.nbrBest=best}spawn();updateUI()}}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}function draw(){ctx.clearRect(0,0,W,H);const g=ctx.createLinearGradient(0,topY,0,bottomY);g.addColorStop(0,'#17274f');g.addColorStop(1,'#101a36');ctx.fillStyle=g;roundRect(3,topY-4,W-6,bottomY-topY+8,8);ctx.fill();ctx.strokeStyle='#49649d';ctx.lineWidth=2;ctx.stroke();ctx.strokeStyle='#ffffff0a';ctx.lineWidth=1;for(let x=offsetX;x<W;x+=cell){ctx.beginPath();ctx.moveTo(x,topY);ctx.lineTo(x,bottomY);ctx.stroke()}for(let y=topY;y<bottomY;y+=cell){ctx.beginPath();ctx.moveTo(5,y);ctx.lineTo(W-5,y);ctx.stroke()}
for(const b of bricks){const x=offsetX+b.c*cell+2,y=topY+b.r*cell+2,w=cell-4,h=cell-4;let color=b.type==='bomb'?'#ff8539':b.type==='armor'?'#bc62ff':b.hp>=level*3?'#f7b62e':b.hp>=level*1.6?'#48d95e':'#29c9f3';ctx.shadowColor=color;ctx.shadowBlur=b.flash?25:9;ctx.fillStyle=color;roundRect(x,y,w,h,5);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#ffffff44';ctx.beginPath();ctx.moveTo(x+3,y+3);ctx.lineTo(x+w-3,y+3);ctx.lineTo(x+w-11,y+12);ctx.lineTo(x+11,y+12);ctx.closePath();ctx.fill();ctx.fillStyle='#00000038';ctx.fillRect(x+7,y+h-10,w-14,6);ctx.fillStyle='#10213b';ctx.font='bold 22px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.type==='bomb'?'💥':b.hp,x+w/2,y+h/2+2);b.flash=Math.max(0,b.flash-.07)}
for(const p of pickups){const x=offsetX+p.c*cell+31,y=topY+p.r*cell+31;ctx.shadowColor=p.type==='ball'?'#ffd33c':'#70faff';ctx.shadowBlur=20;ctx.fillStyle=p.type==='ball'?'#ffd33c':'#71ffff';ctx.beginPath();ctx.arc(x,y,13,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#17213e';ctx.font='bold 19px system-ui';ctx.textAlign='center';ctx.fillText(p.type==='ball'?'+':'⚡',x,y+1)}
for(const b of balls){if(b.done)continue;for(let i=0;i<b.trail.length;i++){ctx.fillStyle=`rgba(255,185,30,${i/b.trail.length*.35})`;ctx.beginPath();ctx.arc(...b.trail[i],3+i*.45,0,Math.PI*2);ctx.fill()}ctx.shadowColor='#ffcb35';ctx.shadowBlur=15;ctx.fillStyle='#ffd23b';ctx.beginPath();ctx.arc(b.x,b.y,6,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}
for(const p of particles){ctx.globalAlpha=p.life/20;ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4);p.x+=p.vx;p.y+=p.vy;p.life--}ctx.globalAlpha=1;particles=particles.filter(p=>p.life>0);
ctx.shadowColor='#49dfff';ctx.shadowBlur=15;ctx.fillStyle='#ffd236';ctx.beginPath();ctx.arc(returnX,launcherY,9,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.textAlign='center';ctx.font='bold 17px system-ui';ctx.fillStyle='#e3f7ff';ctx.fillText('×'+total,returnX,launcherY+28);
if(aiming&&!shooting){let x=returnX,y=launcherY,vx=Math.cos(angle),vy=Math.sin(angle);ctx.strokeStyle='#9efaffaa';ctx.setLineDash([5,9]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);for(let i=0;i<130;i++){x+=vx*5;y+=vy*5;if(x<9||x>W-9)vx*=-1;if(y<topY+6)break;ctx.lineTo(x,y)}ctx.stroke();ctx.setLineDash([])}if(performance.now()<toastUntil){$('toast').textContent=toastText}else $('toast').textContent='';ctx.textAlign='center';ctx.fillStyle='#b8d0ff';ctx.font='bold 17px system-ui';ctx.fillText(shooting?'الكرات: '+finished+'/'+total:'اسحب للتصويب ثم ارفع إصبعك',225,775)}
function frame(t){const delta=Math.min(50,t-last||16);last=t;if(!paused){for(let i=0;i<(speed===2?2:1);i++)physics()}draw();requestAnimationFrame(frame)}function pointer(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}canvas.addEventListener('pointerdown',e=>{if(shooting||gameOver||paused)return;const p=pointer(e);if(p.y<topY-30)return;aiming=true;canvas.setPointerCapture(e.pointerId);setAngle(p)});function setAngle(p){const dx=p.x-returnX,dy=p.y-launcherY;angle=Math.atan2(Math.min(-12,dy),dx);angle=Math.max(-Math.PI+.17,Math.min(-.17,angle))}canvas.addEventListener('pointermove',e=>{if(aiming)setAngle(pointer(e))});canvas.addEventListener('pointerup',e=>{if(aiming){setAngle(pointer(e));fire()}});$('play').onclick=reset;$('restart').onclick=reset;$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶ متابعة':'⏸ إيقاف'};$('speed').onclick=()=>{speed=speed===1?2:1;$('speed').textContent='⚡ تسريع ×'+speed};$('undo').onclick=()=>{if(undoUsed||shooting||!snapshot)return;const s=JSON.parse(snapshot);bricks=s.bricks;pickups=s.pickups;total=s.total;level=s.level;score=s.score;returnX=s.returnX;undoUsed=true;updateUI();notice('تم التراجع')};requestAnimationFrame(frame)})();
</script></body></html>
